name: Sync Google catalogue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-google-catalogue.yml"
      - "scripts/**"
  workflow_dispatch:
  schedule:
    # 23:30 UTC = 05:00 India Standard Time, every day.
    - cron: "30 23 * * *"

permissions:
  contents: write

concurrency:
  group: google-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sync dependencies
        run: pip install -r scripts/requirements.txt
      - name: Build catalogue from Google Drive and Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_google_catalogue.py
      - name: Commit changed catalogue
        run: |
          # `images/products` is absent when no Drive photo matches a sheet product yet.
          # Stage the parent folder so both new files and removals are handled safely.
          git add -A data/products.json data/categories.json images sitemap.xml
          git diff --cached --quiet && exit 0
          git config user.name "uooam-catalogue-bot"
          git config user.email "uooam-catalogue-bot@users.noreply.github.com"
          git commit -m "Sync catalogue from Google Drive"
          git push
